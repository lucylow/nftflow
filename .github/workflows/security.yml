name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        run: |
          npm audit --audit-level=high --json > audit-results.json || true
          npm audit --audit-level=high
        continue-on-error: true
        
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: audit-results.json
          
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-results.json
        continue-on-error: true
        
      - name: Upload Snyk results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-results
          path: snyk-results.json
          
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      - name: Run ESLint security rules
        run: |
          npm install --save-dev eslint-plugin-security
          npx eslint . --ext .js,.ts,.tsx --config .eslintrc.security.js
        continue-on-error: true
        
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  smart-contract-security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Slither
        run: |
          pip3 install slither-analyzer
          
      - name: Run Slither analysis
        run: |
          slither contracts/ --json slither-results.json || true
          slither contracts/ --print human-summary
        continue-on-error: true
        
      - name: Upload Slither results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-results
          path: slither-results.json
          
      - name: Install Mythril
        run: |
          pip3 install mythril
          
      - name: Run Mythril analysis
        run: |
          myth analyze contracts/NFTFlowCore.sol --execution-timeout 300 --max-depth 10 --json mythril-results.json || true
        continue-on-error: true
        
      - name: Upload Mythril results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mythril-results
          path: mythril-results.json
          
      - name: Run Echidna fuzzing
        run: |
          # Install Echidna
          wget https://github.com/crytic/echidna/releases/download/v2.2.0/echidna-test-2.2.0-Ubuntu-18.04.tar.gz
          tar -xzf echidna-test-2.2.0-Ubuntu-18.04.tar.gz
          sudo mv echidna-test /usr/local/bin/
          
          # Run fuzzing tests
          echidna-test contracts/NFTFlowCore.sol --config echidna-config.yaml || true
        continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run dependency check
        run: |
          npx audit-ci --config audit-ci.json
        continue-on-error: true
        
      - name: Check for outdated packages
        run: |
          npm outdated --json > outdated-packages.json || true
          npm outdated
        continue-on-error: true
        
      - name: Upload outdated packages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdated-packages
          path: outdated-packages.json

  security-report:
    runs-on: ubuntu-latest
    needs: [security-scan, smart-contract-security, dependency-check]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Generate security report
        run: |
          echo "# Security Audit Report" > security-report.md
          echo "Generated on: $(date)" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Summary" >> security-report.md
          echo "- Node.js dependencies: $(if [ -f npm-audit-results/audit-results.json ]; then echo 'Scanned'; else echo 'Failed'; fi)" >> security-report.md
          echo "- Smart contracts: $(if [ -f slither-results/slither-results.json ]; then echo 'Scanned'; else echo 'Failed'; fi)" >> security-report.md
          echo "- Code quality: $(if [ -f snyk-results/snyk-results.json ]; then echo 'Scanned'; else echo 'Failed'; fi)" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Recommendations" >> security-report.md
          echo "1. Review and address any high-severity vulnerabilities" >> security-report.md
          echo "2. Update outdated dependencies" >> security-report.md
          echo "3. Consider additional manual security review" >> security-report.md
          echo "4. Implement automated dependency updates" >> security-report.md
          
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          
      - name: Comment PR with security report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  notify-security-team:
    runs-on: ubuntu-latest
    needs: [security-scan, smart-contract-security]
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Notify security team
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'Security audit failed on main branch'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: env.SLACK_WEBHOOK != ''
