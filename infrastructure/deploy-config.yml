version: 1.0
environments:
  testnet:
    chainId: 50312
    rpc:
      primary: https://dream-rpc.somnia.network/
      fallback: https://somnia-testnet-rpc.ankr.com/
    explorer: https://shannon-explorer.somnia.network/
    gasLimit: 30000000
    gasPrice: 20000000000
    confirmations: 1
    
  staging:
    chainId: 50312 # Using testnet for staging
    rpc:
      primary: https://staging-rpc.somnia.network/
      fallback: https://staging-rpc2.somnia.network/
    explorer: https://staging-explorer.somnia.network/
    gasLimit: 30000000
    gasPrice: 20000000000
    confirmations: 2
    
  mainnet:
    chainId: 7331 # Example mainnet chain ID
    rpc:
      primary: https://mainnet-rpc.somnia.network/
      fallback: 
        - https://mainnet-rpc2.somnia.network/
        - https://somnia-mainnet-rpc.ankr.com/
    explorer: https://explorer.somnia.network/
    gasLimit: 30000000
    gasPrice: 25000000000 # 25 Gwei for mainnet
    confirmations: 3

deploymentPhases:
  canary:
    userPercentage: 5
    regions: ["us-east-1"]
    featureFlags:
      rentalCreation: true
      paymentStreaming: true
      reputationSystem: false
      
  gradual:
    - stage: 1
      userPercentage: 25
      regions: ["us-east-1", "eu-west-1"]
    - stage: 2  
      userPercentage: 50
      regions: ["us-east-1", "eu-west-1", "ap-southeast-1"]
    - stage: 3
      userPercentage: 100
      regions: ["us-east-1", "eu-west-1", "ap-southeast-1", "sa-east-1"]
      
rollbackTriggers:
  transactionFailureRate: 5% # Rollback if >5% of transactions fail
  gasPriceSpike: 200% # Rollback if gas prices spike 200% above baseline
  errorRate: 3% # Rollback if API error rate >3%
